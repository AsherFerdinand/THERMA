name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      # Optional plotting smoke test uses synthetic export data, not MATLAB evidence.
      - run: uv run --frozen --with matplotlib==3.10.8 pytest tests/test_replay_analysis.py -k publication_plot_exports
      # Integrity of imported reports and mappings, not MATLAB re-execution.
      - run: uv run --frozen python -m therma.validation.archive --check
      - run: uv run --frozen python -m therma.validation.replay --check-matrix
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      # Static MATLAB lint only; this does not execute Simulink verification.
      - run: uv tool run --from miss-hit==0.9.44 mh_lint --brief scripts/matlab tests/matlab
      - run: uv build

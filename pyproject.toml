[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "therma"
version = "0.1.0"
description = "Modular digital twin of a hydronic building heating system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "pandas>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/therma"]
